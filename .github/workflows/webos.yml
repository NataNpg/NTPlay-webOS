name: webOS (.ipk) e site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # logos dos canais (base pública do iptv-org), atualizados a cada compilação; se falhar, usa o que já está no repositório
      - name: Logos
        run: git clone --depth 1 https://github.com/iptv-org/database /tmp/iptvdb && node tools/build-logos.mjs /tmp/iptvdb/data || echo "mantendo app/logos.json"
      # cópia dos logos do imgur no GitHub Pages (o imgur não abre na TV); cache entre compilações
      - uses: actions/cache@v4
        with:
          path: .logo-cache
          key: logos-${{ github.run_id }}
          restore-keys: logos-
      - name: Site (política, lista de demonstração e logos)
        run: |
          mkdir -p site && cp -r docs/. site/
          node tools/mirror-logos.mjs site .logo-cache || echo "cópia dos logos falhou; o app usa o imgur"
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # versão: major.minor do package.json + número da execução (ex.: 1.1.0 → 1.1.37)
      - name: Versão
        id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "ver=$base.${{ github.run_number }}" >> $GITHUB_OUTPUT
      - run: node build.mjs ${{ steps.v.outputs.ver }}
      - run: npx ares-package dist -o out
      - name: Arquivos da release
        run: |
          cp out/*.ipk out/NTPlay-webOS.ipk
          (cd dist && zip -qr ../out/NTPlay-webOS-app.zip .)
          echo "{\"name\":\"${{ steps.v.outputs.ver }}\",\"code\":${{ github.run_number }}}" > out/webos-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: ntplay-webos
          path: out/NTPlay-webOS.ipk
      - name: Publica na release webos-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete webos-latest --yes --cleanup-tag || true
          gh release create webos-latest out/NTPlay-webOS.ipk out/NTPlay-webOS-app.zip out/webos-version.json \
            --title "NTPlay webOS ${{ steps.v.outputs.ver }}" \
            --notes "Instale com: ares-install NTPlay-webOS.ipk (TV em Modo Desenvolvedor) ou pelo Homebrew Channel."

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
